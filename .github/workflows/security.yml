name: 安全回归
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --ignore-scripts --registry=https://registry.npmjs.org
      - run: pnpm test
      - run: pnpm typecheck
      - run: node scripts/check-secrets.mjs
      - run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org
